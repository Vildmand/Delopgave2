# Start hele løsningen: docker compose up --build
# To containere: "db" (PostgreSQL, databasen) og "api" (vores FastAPI-kode).
# Databasen er altså adskilt fra API'et, og data overlever en genstart (volume "pgdata").
# Stop: docker compose down   (tilføj IKKE -v, for så slettes dataene)
services:
  # --- Container 1: databasen ------------------------------------------------
  db:
    image: postgres:16   # officielt PostgreSQL-image, version 16
    environment:         # brugernavn, adgangskode og databasenavn oprettes ved første start
      POSTGRES_USER: fugt
      POSTGRES_PASSWORD: fugt  # kun til lokal demo, aldrig i produktion
      POSTGRES_DB: fugt
    # Ingen "ports" her: databasen kan kun nås af API'et inde i Dockers eget netværk,
    # ikke fra resten af Wi-Fi-nettet. Kig i den med: docker compose exec db psql -U fugt
    volumes:
      - pgdata:/var/lib/postgresql/data  # dataene gemmes uden for containeren
    healthcheck:  # API'et venter, til databasen svarer
      test: ["CMD", "pg_isready", "-U", "fugt"]   # PostgreSQLs eget "er du klar?"-tjek
      interval: 2s
      retries: 15

  # --- Container 2: vores API -------------------------------------------------
  api:
    build: .   # byg imaget ud fra Dockerfile i denne mappe
    environment:
      # Fortæller db.py, at den skal bruge PostgreSQL. "db" er navnet på containeren ovenfor.
      DATABASE_URL: postgresql+psycopg://fugt:fugt@db:5432/fugt
    ports:
      - "8000:8000"  # Pi'en og browseren rammer http://<pc-ip>:8000
    depends_on:
      db:
        condition: service_healthy   # start først API'et, når healthchecket er grønt

# Navngivet volume: Dockers egen lagerplads til databasens filer.
volumes:
  pgdata:
